services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padhaku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padhaku_local_only}
      POSTGRES_DB: padhaku
    ports:
      - "5432:5432"
    volumes:
      - padhaku_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padhaku -d padhaku"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://padhaku:${POSTGRES_PASSWORD:-padhaku_local_only}@postgres:5432/padhaku
      FRONTEND_ORIGINS: http://localhost:3000
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-z-ai/glm-5.3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  padhaku_pgdata:
