services:
  - type: web
    name: padhaku-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: padhaku-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: padhaku-db
    databaseName: padhaku
    user: padhaku
